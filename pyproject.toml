[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cachereaper"
version = "1.2.0"
description = "Risk-tiered cache and build-artifact reclaimer with an interactive picker"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Samreshan Sahani" }]
keywords = ["cache", "cleanup", "disk", "storage", "build-artifacts", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
cachereaper = "cachereaper:main"

[tool.setuptools]
py-modules = ["cachereaper"]
