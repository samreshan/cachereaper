[package]
name = "cachereaper-core"
version = "1.5.0"
edition = "2021"
description = "Parallel disk scanner and safety guards behind the cachereaper GUI"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "cachereaper_core"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
