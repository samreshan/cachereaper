[package]
name = "cachereaper-core"
version = "2.1.0"
edition = "2021"
description = "Parallel disk scanner and safety guards behind the cachereaper GUI"
license = "MIT"

[features]
default = ["media-intelligence"]
local-ai = []
media-intelligence = ["dep:image"]
offload-connectors = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[lib]
name = "cachereaper_core"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
