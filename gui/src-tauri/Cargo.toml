[package]
name = "cachereaper-gui"
version = "2.1.0"
edition = "2021"
description = "Treemap disk visualiser that knows which blocks are safe to delete"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cachereaper-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", features = ["NSError", "NSFileManager", "NSString", "NSURL"] }

[features]
# used by `cargo tauri dev`/`build` on some platforms
custom-protocol = ["tauri/custom-protocol"]
local-ai = ["cachereaper-core/local-ai"]
media-intelligence = ["cachereaper-core/media-intelligence"]
offload-connectors = ["cachereaper-core/offload-connectors"]
