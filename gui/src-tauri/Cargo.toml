[package]
name = "cachereaper-gui"
version = "1.1.1"
edition = "2021"
description = "Treemap disk visualiser that knows which blocks are safe to delete"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cachereaper-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# used by `cargo tauri dev`/`build` on some platforms
custom-protocol = ["tauri/custom-protocol"]
